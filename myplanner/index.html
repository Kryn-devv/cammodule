<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyPlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Albert+Sans:ital,wght@0,400..800;1,400..800&family=Spline+Sans+Mono:wght@400..600&display=swap">
<style>
/* ============================================================
   MyPlanner — tokens
   ============================================================ */
:root{
  color-scheme: light;

  --bg:            #F2F5F0;
  --surface:       #FDFDFB;
  --surface-2:     #EDF1EA;
  --surface-3:     #E4EAE1;
  --line:          #DCE3D8;
  --line-soft:     #E7ECE3;

  --ink:           #1B2823;
  --ink-soft:      #57685F;
  --ink-faint:     #90A096;

  --accent:        #1E5C4E;
  --accent-strong: #174A3E;
  --on-accent:     #F6FBF8;
  --accent-tint:   #E0EDE7;
  --accent-ghost:  #EDF4F0;

  --gold:          #D9931F;
  --gold-strong:   #B87A12;
  --gold-tint:     #FAEDD4;
  --on-gold:       #3A2A08;

  --danger:        #C14F38;
  --danger-tint:   #F8E4DE;

  --pri-high:      #C14F38;
  --pri-high-bg:   #F8E4DE;
  --pri-med:       #D9931F;
  --pri-med-bg:    #FAEDD4;
  --pri-low:       #67997F;
  --pri-low-bg:    #E2EFE7;

  --cat-work:        #3F659B; --cat-work-bg:      #E4EBF5;
  --cat-personal:    #A85875; --cat-personal-bg:  #F7E5EC;
  --cat-study:       #6C5CA8; --cat-study-bg:     #EBE7F7;
  --cat-health:      #20776C; --cat-health-bg:    #DDF0EC;
  --cat-other:       #77715E; --cat-other-bg:     #EEEBE0;

  --shadow-sm: 0 1px 2px rgba(23,45,36,.05);
  --shadow-md: 0 1px 2px rgba(23,45,36,.06), 0 10px 28px -14px rgba(23,45,36,.18);
  --shadow-lg: 0 2px 6px rgba(23,45,36,.07), 0 24px 60px -20px rgba(23,45,36,.28);

  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Albert Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r-lg: 16px;
  --r-md: 12px;
  --r-sm: 9px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;

    --bg:            #111917;
    --surface:       #1A2420;
    --surface-2:     #212D28;
    --surface-3:     #283630;
    --line:          #2E3B35;
    --line-soft:     #263129;

    --ink:           #E9EFE9;
    --ink-soft:      #A8B6AC;
    --ink-faint:     #75847B;

    --accent:        #6FBCA3;
    --accent-strong: #8AD1B9;
    --on-accent:     #0C1A15;
    --accent-tint:   #21362E;
    --accent-ghost:  #1C2C26;

    --gold:          #E5AC4D;
    --gold-strong:   #F0C077;
    --gold-tint:     #3A2E15;
    --on-gold:       #1F1604;

    --danger:        #E58A72;
    --danger-tint:   #442720;

    --pri-high:      #E58A72; --pri-high-bg: #442720;
    --pri-med:       #EAB55E; --pri-med-bg:  #403014;
    --pri-low:       #8FC3AA; --pri-low-bg:  #21362C;

    --cat-work:      #92B4DF; --cat-work-bg:     #243448;
    --cat-personal:  #DE9EB8; --cat-personal-bg: #3F2733;
    --cat-study:     #B4A7E4; --cat-study-bg:    #2F2A48;
    --cat-health:    #7EC6B9; --cat-health-bg:   #1C3B36;
    --cat-other:     #C2BBA3; --cat-other-bg:    #363329;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
    --shadow-md: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.5);
    --shadow-lg: 0 2px 6px rgba(0,0,0,.35), 0 24px 60px -18px rgba(0,0,0,.6);
  }
}

:root[data-theme="dark"]{
  color-scheme: dark;

  --bg:            #111917;
  --surface:       #1A2420;
  --surface-2:     #212D28;
  --surface-3:     #283630;
  --line:          #2E3B35;
  --line-soft:     #263129;

  --ink:           #E9EFE9;
  --ink-soft:      #A8B6AC;
  --ink-faint:     #75847B;

  --accent:        #6FBCA3;
  --accent-strong: #8AD1B9;
  --on-accent:     #0C1A15;
  --accent-tint:   #21362E;
  --accent-ghost:  #1C2C26;

  --gold:          #E5AC4D;
  --gold-strong:   #F0C077;
  --gold-tint:     #3A2E15;
  --on-gold:       #1F1604;

  --danger:        #E58A72;
  --danger-tint:   #442720;

  --pri-high:      #E58A72; --pri-high-bg: #442720;
  --pri-med:       #EAB55E; --pri-med-bg:  #403014;
  --pri-low:       #8FC3AA; --pri-low-bg:  #21362C;

  --cat-work:      #92B4DF; --cat-work-bg:     #243448;
  --cat-personal:  #DE9EB8; --cat-personal-bg: #3F2733;
  --cat-study:     #B4A7E4; --cat-study-bg:    #2F2A48;
  --cat-health:    #7EC6B9; --cat-health-bg:   #1C3B36;
  --cat-other:     #C2BBA3; --cat-other-bg:    #363329;

  --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
  --shadow-md: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.5);
  --shadow-lg: 0 2px 6px rgba(0,0,0,.35), 0 24px 60px -18px rgba(0,0,0,.6);
}

/* ============================================================
   Base
   ============================================================ */
*, *::before, *::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p{ margin:0; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
input, select, textarea{ font:inherit; color:inherit; }
img, svg{ display:block; max-width:100%; }
[hidden]{ display:none !important; }
.hidden{ display:none !important; }
kbd{
  font-family:var(--font-mono); font-size:11px;
  background:var(--surface-2); border:1px solid var(--line);
  border-bottom-width:2px; border-radius:5px; padding:1px 5px;
}
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:4px; }
::placeholder{ color:var(--ink-faint); }
.container{ max-width:1180px; margin:0 auto; padding:0 22px; }

/* ============================================================
   Header
   ============================================================ */
.top{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.topbar{
  display:flex; align-items:center; gap:18px;
  padding-top:14px; padding-bottom:8px; flex-wrap:wrap;
}
.brand{ display:flex; align-items:center; gap:11px; min-width:0; }
.logo{
  width:38px; height:38px; flex:none; border-radius:11px;
  background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center;
  box-shadow:var(--shadow-sm);
}
:root[data-theme="dark"] .logo{ color:#0C1A15; }
.logo svg{ width:20px; height:20px; }
.logo .tick{ stroke:var(--gold); }
:root[data-theme="dark"] .logo .tick{ stroke:#B87A12; }
.brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.brand-name{
  font-family:var(--font-display); font-weight:600; font-size:19px;
  letter-spacing:.01em; font-variation-settings:"opsz" 40;
}
.brand-date{ font-size:12.5px; color:var(--ink-soft); white-space:nowrap; }

.head-quote{
  flex:1 1 260px; min-width:0;
  display:flex; align-items:center; justify-content:center; gap:8px;
  text-align:center;
}
.head-quote .quote-text{
  font-family:var(--font-display); font-style:italic; font-size:14px;
  color:var(--ink-soft); font-variation-settings:"opsz" 20;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  max-width:52ch;
  transition:opacity .35s ease;
}
.head-quote .quote-text.fading{ opacity:0; }
.head-quote .quote-author{ font-style:normal; color:var(--ink-faint); font-size:12.5px; }

.head-actions{ display:flex; align-items:center; gap:9px; margin-left:auto; }

.searchwrap{
  display:flex; align-items:center; gap:7px;
  background:var(--surface); border:1px solid var(--line);
  border-radius:999px; padding:7px 13px; width:210px;
  transition:width .25s ease, border-color .2s ease, box-shadow .2s ease;
}
.searchwrap:focus-within{
  border-color:var(--accent); width:250px;
  box-shadow:0 0 0 3px var(--accent-tint);
}
.searchwrap svg{ width:15px; height:15px; color:var(--ink-faint); flex:none; }
.searchwrap input{
  border:0; background:none; outline:none; width:100%;
  font-size:13.5px; padding:0;
}
.searchwrap input::-webkit-search-cancel-button{ -webkit-appearance:none; }

.iconbtn{
  width:36px; height:36px; border-radius:10px; flex:none;
  display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--line);
  color:var(--ink-soft);
  transition:background .15s ease, color .15s ease, transform .12s ease, border-color .15s ease;
  position:relative;
}
.iconbtn:hover{ background:var(--surface-2); color:var(--ink); }
.iconbtn:active{ transform:scale(.94); }
.iconbtn svg{ width:16px; height:16px; }
.iconbtn.ghost{ background:none; border:0; width:28px; height:28px; }
.iconbtn.active{ background:var(--accent-tint); border-color:var(--accent); color:var(--accent); }
.filter-count{
  position:absolute; top:-5px; right:-5px;
  min-width:16px; height:16px; padding:0 4px; border-radius:999px;
  background:var(--gold); color:var(--on-gold);
  font-size:10.5px; font-weight:700; line-height:16px; text-align:center;
}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 15px; border-radius:10px;
  background:var(--surface); border:1px solid var(--line);
  font-weight:600; font-size:13.5px; white-space:nowrap;
  transition:background .15s ease, transform .12s ease, box-shadow .15s ease, border-color .15s ease;
}
.btn:hover{ background:var(--surface-2); }
.btn:active{ transform:scale(.97); }
.btn svg{ width:15px; height:15px; }
.btn-primary{
  background:var(--accent); border-color:var(--accent); color:var(--on-accent);
  box-shadow:var(--shadow-sm);
}
.btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
.btn-danger{
  background:none; border-color:transparent; color:var(--danger);
}
.btn-danger:hover{ background:var(--danger-tint); }
.btn-sm{ padding:5px 11px; font-size:12.5px; border-radius:8px; }
.linklike{
  color:var(--accent); font-weight:600; font-size:inherit;
  text-decoration:underline; text-decoration-color:transparent;
  transition:text-decoration-color .15s ease;
}
.linklike:hover{ text-decoration-color:currentColor; }

/* View nav */
.viewnav{
  display:flex; gap:4px; padding-bottom:0; overflow-x:auto;
  scrollbar-width:none;
}
.viewnav::-webkit-scrollbar{ display:none; }
.tab{
  padding:9px 16px 11px; font-weight:600; font-size:14px;
  color:var(--ink-soft); border-radius:10px 10px 0 0;
  position:relative; flex:none;
  transition:color .15s ease, background .15s ease;
}
.tab:hover{ color:var(--ink); background:var(--accent-ghost); }
.tab::after{
  content:""; position:absolute; left:14px; right:14px; bottom:0;
  height:3px; border-radius:3px 3px 0 0; background:transparent;
  transition:background .2s ease;
}
.tab.active{ color:var(--accent); }
.tab.active::after{ background:var(--accent); }

/* ============================================================
   Popover (filters)
   ============================================================ */
.filterwrap{ position:relative; }
.popover{
  position:absolute; top:calc(100% + 9px); right:0; z-index:60;
  width:262px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r-md);
  box-shadow:var(--shadow-lg); padding:15px;
  animation:pop-in .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop-in{
  from{ opacity:0; transform:translateY(-5px) scale(.97); }
  to{ opacity:1; transform:none; }
}
.popover h4{
  font-size:11px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--ink-faint); font-weight:700; margin:0 0 8px;
}
.popover .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.popover .clear-row{ display:flex; justify-content:space-between; align-items:center; margin-top:2px; }
.fchip{
  display:inline-flex; align-items:center; gap:6px;
  padding:5px 11px; border-radius:999px; font-size:12.5px; font-weight:600;
  background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft);
  transition:all .15s ease;
}
.fchip:hover{ border-color:var(--ink-faint); }
.fchip.on{ background:var(--accent-tint); border-color:var(--accent); color:var(--accent); }
.fchip .dot{ width:8px; height:8px; border-radius:50%; flex:none; }

/* ============================================================
   Shared bits — chips, bars, cards
   ============================================================ */
.chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:2.5px 9px; border-radius:999px;
  font-size:11.5px; font-weight:600; line-height:1.5;
  white-space:nowrap;
}
.chip .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
.chip-time{
  background:var(--surface-2); color:var(--ink-soft);
  font-family:var(--font-mono); font-size:11px; font-weight:500;
}
.chip-time svg{ width:11px; height:11px; }
.chip-goal{
  background:var(--gold-tint); color:var(--gold-strong);
  max-width:170px; overflow:hidden; text-overflow:ellipsis;
}
.chip-goal svg{ width:11px; height:11px; flex:none; }
.chip-date{ background:var(--surface-2); color:var(--ink-soft); font-family:var(--font-mono); font-size:11px; font-weight:500; }

.cat-work{ background:var(--cat-work-bg); color:var(--cat-work); }
.cat-personal{ background:var(--cat-personal-bg); color:var(--cat-personal); }
.cat-study{ background:var(--cat-study-bg); color:var(--cat-study); }
.cat-health{ background:var(--cat-health-bg); color:var(--cat-health); }
.cat-other{ background:var(--cat-other-bg); color:var(--cat-other); }

.pri-chip-high{ background:var(--pri-high-bg); color:var(--pri-high); }
.pri-chip-medium{ background:var(--pri-med-bg); color:var(--pri-med); }
.pri-chip-low{ background:var(--pri-low-bg); color:var(--pri-low); }

.bar{
  height:8px; border-radius:999px; background:var(--surface-3);
  overflow:hidden; flex:1;
}
.bar-fill{
  height:100%; border-radius:999px; background:var(--accent);
  transition:width .6s cubic-bezier(.25,.9,.3,1);
  min-width:0;
}
.bar-fill.gold{ background:var(--gold); }

.card{
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--r-lg); box-shadow:var(--shadow-sm);
}

/* Task cards */
.task{
  display:flex; gap:11px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--r-md); padding:11px 13px 11px 15px;
  box-shadow:var(--shadow-sm); position:relative;
  transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease, opacity .3s ease;
  animation:task-in .3s cubic-bezier(.2,.9,.3,1) backwards;
  cursor:pointer;
}
@keyframes task-in{
  from{ opacity:0; transform:translateY(7px); }
  to{ opacity:1; transform:none; }
}
.task::before{
  content:""; position:absolute; left:0; top:10px; bottom:10px;
  width:3.5px; border-radius:0 4px 4px 0;
}
.task.pri-high::before{ background:var(--pri-high); }
.task.pri-medium::before{ background:var(--pri-med); }
.task.pri-low::before{ background:var(--pri-low); }
.task:hover{
  box-shadow:var(--shadow-md); transform:translateY(-1px);
  border-color:var(--line);
}
.task.done{ opacity:.62; }
.task.done .task-title{
  text-decoration:line-through;
  text-decoration-color:var(--ink-faint);
  color:var(--ink-soft);
}
.task.dragging{ opacity:.45; transform:rotate(1.5deg) scale(.98); box-shadow:var(--shadow-lg); }

.task-main{ min-width:0; flex:1; }
.task-title{ font-weight:600; font-size:13.5px; line-height:1.35; overflow-wrap:break-word; }
.task-desc{
  font-size:12.5px; color:var(--ink-soft); margin-top:2px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.task-meta{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; align-items:center; }
.task-edit{
  opacity:0; flex:none; width:26px; height:26px; border-radius:7px;
  display:grid; place-items:center; color:var(--ink-faint);
  transition:opacity .15s ease, background .15s ease, color .15s ease;
  margin:-2px -4px 0 0;
}
.task:hover .task-edit{ opacity:1; }
.task-edit:hover{ background:var(--surface-2); color:var(--ink); }
.task-edit svg{ width:13px; height:13px; }

/* Checkbox */
.checkbox{
  width:21px; height:21px; flex:none; margin-top:1px;
  border-radius:7px; border:1.5px solid var(--line);
  background:var(--surface); display:grid; place-items:center;
  transition:background .18s ease, border-color .18s ease, transform .12s ease;
}
.checkbox:hover{ border-color:var(--accent); }
.checkbox:active{ transform:scale(.85); }
.checkbox svg{ width:12px; height:12px; }
.checkbox svg path{
  stroke:var(--on-accent); stroke-dasharray:22; stroke-dashoffset:22;
  transition:stroke-dashoffset .25s ease .05s;
}
.checkbox.checked{ background:var(--accent); border-color:var(--accent); }
.checkbox.checked svg path{ stroke-dashoffset:0; }

/* View header (shared) */
.view{ padding:26px 0 60px; animation:view-in .28s ease backwards; }
@keyframes view-in{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:none; }
}
.view-head{
  display:flex; align-items:center; gap:13px; flex-wrap:wrap; margin-bottom:20px;
}
.view-title{
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(21px, 3vw, 26px); letter-spacing:.005em;
  font-variation-settings:"opsz" 60;
  text-wrap:balance;
}
.view-title .muted{ color:var(--ink-faint); font-weight:400; }
.view-sub{ font-size:13px; color:var(--ink-soft); }
.view-head .spacer{ flex:1; }
.navgroup{ display:flex; align-items:center; gap:5px; }

.filter-note{
  display:inline-flex; align-items:center; gap:9px;
  background:var(--gold-tint); color:var(--gold-strong);
  border-radius:999px; padding:5px 8px 5px 13px;
  font-size:12.5px; font-weight:600;
  margin-bottom:16px;
}
.filter-note button{
  font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:999px;
  background:var(--surface); color:var(--gold-strong);
}

/* ============================================================
   Day view
   ============================================================ */
.day-layout{ display:grid; grid-template-columns:330px 1fr; gap:22px; align-items:start; }
.day-side{ display:flex; flex-direction:column; gap:16px; position:sticky; top:118px; }

.progress-card{ padding:19px 20px; }
.progress-card .pc-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.progress-card .pc-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.09em;
  font-weight:700; color:var(--ink-faint);
}
.progress-card .pc-num{
  font-family:var(--font-display); font-size:34px; font-weight:600;
  font-variation-settings:"opsz" 60; line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.progress-card .pc-num .of{ font-size:17px; color:var(--ink-faint); font-weight:400; }
.progress-card .pc-msg{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; }
.progress-card .bar{ margin-top:13px; }
.progress-card.all-done .bar-fill{ background:var(--gold); }

.section-label{
  display:flex; align-items:center; gap:8px;
  font-size:11px; text-transform:uppercase; letter-spacing:.09em;
  font-weight:700; color:var(--ink-faint); margin:0 0 10px;
}
.section-label > svg{ width:13px; height:13px; flex:none; }
.section-label .count{
  background:var(--surface-2); color:var(--ink-soft);
  border-radius:999px; padding:0 7px; font-size:10.5px; line-height:17px;
  letter-spacing:0;
}
.section-label .grow{ flex:1; }
.section-label .addbtn{
  width:22px; height:22px; border-radius:7px; display:grid; place-items:center;
  color:var(--ink-faint); transition:all .15s ease;
}
.section-label .addbtn:hover{ background:var(--accent-tint); color:var(--accent); }
.section-label .addbtn svg{ width:13px; height:13px; }

.anytime-list{ display:flex; flex-direction:column; gap:9px; }

/* Timeline */
.timeline{ padding:8px 0; overflow:hidden; }
.tl-row{
  display:grid; grid-template-columns:74px 1fr; gap:0;
  position:relative; min-height:46px;
}
.tl-row + .tl-row{ border-top:1px solid var(--line-soft); }
.tl-label{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
  padding:8px 0 0 18px; user-select:none;
}
.tl-row.now-hour .tl-label{ color:var(--gold-strong); font-weight:600; }
.tl-body{ padding:7px 16px 7px 4px; display:flex; flex-direction:column; gap:7px; position:relative; }
.tl-add{
  position:absolute; inset:4px 12px 4px 0; border-radius:9px;
  display:flex; align-items:center; justify-content:flex-start; gap:6px;
  color:var(--ink-faint); font-size:12px; font-weight:600;
  opacity:0; transition:opacity .15s ease, background .15s ease;
  padding-left:12px;
}
.tl-add svg{ width:12px; height:12px; }
.tl-row:hover .tl-add{ opacity:1; background:var(--accent-ghost); color:var(--accent); }
.tl-body .task{ animation:none; }
.now-line{
  position:absolute; left:66px; right:10px; height:0; z-index:5; pointer-events:none;
}
.now-line::before{
  content:""; position:absolute; left:0; right:0; top:-1px;
  border-top:2px solid var(--gold);
}
.now-line::after{
  content:""; position:absolute; left:-5px; top:-5px;
  width:9px; height:9px; border-radius:50%; background:var(--gold);
}

/* ============================================================
   Week view
   ============================================================ */
.week-layout{ display:grid; grid-template-columns:1fr 285px; gap:22px; align-items:start; }
.week-grid{
  display:grid; grid-template-columns:repeat(7, minmax(168px, 1fr)); gap:9px;
  overflow-x:auto; padding-bottom:6px;
}
.wcol{
  background:var(--surface-2); border:1px solid transparent;
  border-radius:var(--r-md); padding:9px; min-height:210px;
  display:flex; flex-direction:column; gap:8px;
  transition:background .15s ease, border-color .15s ease;
}
.wcol.today{
  background:var(--accent-tint);
  border-color:color-mix(in srgb, var(--accent) 35%, transparent);
}
.wcol.drop-target{
  background:var(--accent-ghost);
  border-color:var(--accent);
  border-style:dashed;
}
.wcol-head{
  display:flex; align-items:baseline; gap:6px; padding:2px 4px;
}
.wcol-head .dname{
  font-size:11px; text-transform:uppercase; letter-spacing:.08em;
  font-weight:700; color:var(--ink-soft);
}
.wcol.today .wcol-head .dname{ color:var(--accent); }
.wcol-head .dnum{
  font-family:var(--font-display); font-size:17px; font-weight:600;
  font-variant-numeric:tabular-nums;
}
.wcol.today .wcol-head .dnum{ color:var(--accent); }
.wcol-head .today-pill{
  font-size:9.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
  background:var(--accent); color:var(--on-accent);
  padding:1.5px 7px; border-radius:999px; margin-left:auto;
}
.wcol-head .wcount{ margin-left:auto; font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
.wcol.today .wcol-head .wcount{ margin-left:6px; }
.wcol .task{ padding:9px 10px 9px 13px; }
.wcol .task .task-title{ font-size:12.5px; }
.wcol .task .task-desc{ display:none; }
.wcol .task .task-edit{ display:none; }
.wcol .task .chip{ font-size:10.5px; padding:1.5px 7px; }
.wcol-add{
  margin-top:auto; border-radius:9px; border:1.5px dashed var(--line);
  color:var(--ink-faint); font-size:12px; font-weight:600;
  padding:7px; display:flex; align-items:center; justify-content:center; gap:5px;
  transition:all .15s ease;
}
.wcol-add svg{ width:12px; height:12px; }
.wcol-add:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-ghost); }

/* Goal side panel */
.goal-panel{ padding:19px 20px; position:sticky; top:118px; }
.goal-panel .gp-list{ display:flex; flex-direction:column; gap:13px; margin-top:13px; }
.goal-mini{ display:flex; flex-direction:column; gap:6px; }
.goal-mini .gm-top{ display:flex; justify-content:space-between; align-items:baseline; gap:9px; }
.goal-mini .gm-title{
  font-size:13px; font-weight:600; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  cursor:pointer;
}
.goal-mini .gm-title:hover{ color:var(--accent); }
.goal-mini .gm-pct{
  font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);
  font-variant-numeric:tabular-nums; flex:none;
}
.goal-mini .bar{ height:6px; }
.gp-empty{ font-size:12.5px; color:var(--ink-faint); margin-top:12px; line-height:1.55; }

/* ============================================================
   Month view
   ============================================================ */
.month-layout{ display:grid; grid-template-columns:1fr 285px; gap:22px; align-items:start; }
.cal{ overflow:hidden; }
.cal-dow{
  display:grid; grid-template-columns:repeat(7,1fr);
  border-bottom:1px solid var(--line-soft);
}
.cal-dow span{
  padding:10px 6px; text-align:center;
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  color:var(--ink-faint);
}
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); }
.cal-cell{
  min-height:92px; padding:8px 9px; text-align:left;
  border-top:1px solid var(--line-soft); border-left:1px solid var(--line-soft);
  display:flex; flex-direction:column; gap:6px; align-items:flex-start;
  transition:background .15s ease;
  position:relative;
}
.cal-grid .cal-cell:nth-child(7n+1){ border-left:0; }
.cal-grid .cal-cell:nth-child(-n+7){ border-top:0; }
.cal-cell:hover{ background:var(--accent-ghost); }
.cal-cell .cnum{
  font-family:var(--font-display); font-size:14.5px; font-weight:600;
  font-variant-numeric:tabular-nums; line-height:1;
  width:26px; height:26px; display:grid; place-items:center; border-radius:8px;
}
.cal-cell.other .cnum{ color:var(--ink-faint); font-weight:400; }
.cal-cell.today .cnum{ background:var(--accent); color:var(--on-accent); }
.cal-badge{
  font-size:10.5px; font-weight:700; font-variant-numeric:tabular-nums;
  background:var(--surface-2); color:var(--ink-soft);
  border-radius:999px; padding:1px 8px;
  display:inline-flex; align-items:center; gap:4px;
}
.cal-badge.done-all{ background:var(--accent-tint); color:var(--accent); }
.cal-badge svg{ width:9px; height:9px; }
.cal-dots{ display:flex; gap:3.5px; margin-top:auto; }
.cal-dots i{ width:6px; height:6px; border-radius:50%; }

.month-goals{ padding:19px 20px; position:sticky; top:118px; }
.month-goals .gp-list{ display:flex; flex-direction:column; gap:13px; margin-top:13px; }

/* ============================================================
   Goals view
   ============================================================ */
.goals-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(295px,1fr)); gap:15px; }
.goals-section{ margin-bottom:32px; }
.goal-card{ padding:19px 20px; display:flex; flex-direction:column; gap:11px; position:relative; }
.goal-card .gc-top{ display:flex; align-items:flex-start; gap:10px; }
.goal-card .gc-title{
  font-weight:700; font-size:15px; line-height:1.35; flex:1; min-width:0;
  overflow-wrap:anywhere;
}
.goal-card.done .gc-title{ color:var(--ink-soft); }
.goal-card .gc-actions{ display:flex; gap:2px; flex:none; opacity:0; transition:opacity .15s ease; }
.goal-card:hover .gc-actions{ opacity:1; }
.goal-card .gc-actions button{
  width:27px; height:27px; border-radius:7px; display:grid; place-items:center;
  color:var(--ink-faint); transition:all .15s ease;
}
.goal-card .gc-actions button:hover{ background:var(--surface-2); color:var(--ink); }
.goal-card .gc-actions button.del:hover{ background:var(--danger-tint); color:var(--danger); }
.goal-card .gc-actions svg{ width:13px; height:13px; }
.goal-card .gc-desc{ font-size:13px; color:var(--ink-soft); margin-top:-4px; }
.goal-card .gc-progress{ display:flex; align-items:center; gap:12px; }
.goal-card .gc-pct{
  font-family:var(--font-display); font-size:24px; font-weight:600;
  font-variant-numeric:tabular-nums; font-variation-settings:"opsz" 40;
  min-width:58px; text-align:right;
}
.goal-card.done .gc-pct{ color:var(--gold-strong); }
.goal-card .gc-meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.deadline-chip{ background:var(--surface-2); color:var(--ink-soft); }
.deadline-chip svg{ width:11px; height:11px; }
.deadline-chip.soon{ background:var(--gold-tint); color:var(--gold-strong); }
.deadline-chip.overdue{ background:var(--danger-tint); color:var(--danger); }
.deadline-chip.met{ background:var(--accent-tint); color:var(--accent); }
.gc-steppers{ display:flex; gap:5px; margin-left:auto; }
.gc-steppers button{
  width:26px; height:26px; border-radius:8px;
  background:var(--surface-2); color:var(--ink-soft);
  font-weight:700; font-size:14px; line-height:1;
  display:grid; place-items:center;
  transition:all .15s ease;
}
.gc-steppers button:hover{ background:var(--accent-tint); color:var(--accent); }
.gc-tasks{ border-top:1px dashed var(--line); padding-top:10px; display:flex; flex-direction:column; gap:6px; }
.gc-tasks .gt-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); }
.gt-row{
  display:flex; align-items:center; gap:8px; font-size:12.5px;
  color:var(--ink-soft); text-align:left; border-radius:6px; padding:2px 4px;
  transition:background .12s ease;
}
.gt-row:hover{ background:var(--surface-2); }
.gt-row .checkbox{ width:16px; height:16px; border-radius:5px; margin:0; }
.gt-row .checkbox svg{ width:9px; height:9px; }
.gt-row span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gt-row.done span{ text-decoration:line-through; color:var(--ink-faint); }

/* ============================================================
   Empty states
   ============================================================ */
.empty{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  text-align:center; padding:44px 24px;
  color:var(--ink-soft);
}
.empty .art{
  width:64px; height:64px; border-radius:20px;
  background:var(--surface-2); color:var(--ink-faint);
  display:grid; place-items:center; margin-bottom:8px;
}
.empty .art svg{ width:28px; height:28px; }
.empty .e-title{ font-family:var(--font-display); font-weight:600; font-size:17px; color:var(--ink); }
.empty .e-sub{ font-size:13px; max-width:34ch; line-height:1.55; }
.empty .btn{ margin-top:12px; }
.empty.slim{ padding:22px 12px; }
.empty.slim .art{ width:44px; height:44px; border-radius:14px; }
.empty.slim .art svg{ width:20px; height:20px; }
.empty.slim .e-title{ font-size:14.5px; font-family:var(--font-body); font-weight:700; }
.empty.slim .e-sub{ font-size:12px; }

/* ============================================================
   Modal
   ============================================================ */
.overlay{
  position:fixed; inset:0; z-index:100;
  background:color-mix(in srgb, var(--ink) 32%, transparent);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
  display:flex; align-items:flex-start; justify-content:center;
  padding:7vh 18px 18px; overflow-y:auto;
  animation:fade-in .18s ease;
}
@keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }
.modal{
  width:100%; max-width:480px;
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:18px; box-shadow:var(--shadow-lg);
  padding:24px; animation:modal-in .25s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes modal-in{
  from{ opacity:0; transform:translateY(14px) scale(.98); }
  to{ opacity:1; transform:none; }
}
.modal-head{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
.modal-title{
  font-family:var(--font-display); font-weight:600; font-size:20px;
  font-variation-settings:"opsz" 40; flex:1;
}
.modal .field{ margin-bottom:14px; }
.modal label.flabel{
  display:block; font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:.08em;
  color:var(--ink-soft); margin-bottom:6px;
}
.modal input[type="text"], .modal input[type="date"], .modal input[type="time"],
.modal textarea, .modal select{
  width:100%; padding:9px 12px; border-radius:10px;
  background:var(--bg); border:1px solid var(--line);
  font-size:14px; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.modal input:focus, .modal textarea:focus, .modal select:focus{
  border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint);
}
.modal textarea{ resize:vertical; min-height:62px; }
.modal .field.invalid input{ border-color:var(--danger); box-shadow:0 0 0 3px var(--danger-tint); animation:shake .3s ease; }
.modal .field .err{ color:var(--danger); font-size:12px; margin-top:5px; display:none; }
.modal .field.invalid .err{ display:block; }
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  25%{ transform:translateX(-4px); }
  75%{ transform:translateX(4px); }
}
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.seg{
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px;
  background:var(--bg); border:1px solid var(--line);
  border-radius:10px; padding:3px;
}
.seg button{
  padding:6.5px 4px; border-radius:8px; font-size:12.5px; font-weight:600;
  color:var(--ink-soft); display:flex; align-items:center; justify-content:center; gap:6px;
  transition:all .15s ease;
}
.seg button .dot{ width:8px; height:8px; border-radius:50%; }
.seg button:hover{ color:var(--ink); }
.seg button.on{ background:var(--surface); box-shadow:var(--shadow-sm); color:var(--ink); }
.seg button.on[data-pri="high"]{ color:var(--pri-high); }
.seg button.on[data-pri="medium"]{ color:var(--pri-med); }
.seg button.on[data-pri="low"]{ color:var(--pri-low); }
.when-row{ display:flex; gap:8px; align-items:center; }
.when-row .seg{ flex:1; }
.when-row input[type="time"]{ width:118px; flex:none; }
.range-wrap{ display:flex; align-items:center; gap:12px; }
.range-wrap input[type="range"]{ flex:1; accent-color:var(--gold); }
.range-wrap output{
  font-family:var(--font-mono); font-size:13px; min-width:44px; text-align:right;
  font-variant-numeric:tabular-nums;
}
.auto-note{
  font-size:12px; color:var(--ink-soft); background:var(--gold-tint);
  border-radius:9px; padding:8px 12px; line-height:1.5;
}
.auto-note b{ color:var(--gold-strong); }
.modal-foot{ display:flex; align-items:center; gap:9px; margin-top:20px; }
.modal-foot .spacer{ flex:1; }

.backup-area{
  width:100%; font-family:var(--font-mono); font-size:11px;
  min-height:88px;
}
.backup-note{ font-size:12.5px; color:var(--ink-soft); margin:4px 0 12px; line-height:1.55; }

/* ============================================================
   Onboarding
   ============================================================ */
.onboard{
  position:fixed; inset:0; z-index:200;
  background:var(--bg);
  display:flex; align-items:center; justify-content:center;
  padding:24px; overflow-y:auto;
}
.onboard-inner{
  max-width:660px; width:100%; text-align:center;
  animation:modal-in .4s cubic-bezier(.2,.9,.3,1.05);
}
.onboard .logo{ width:52px; height:52px; border-radius:15px; margin:0 auto 18px; }
.onboard .logo svg{ width:27px; height:27px; }
.onboard h1{
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(26px, 5vw, 36px); font-variation-settings:"opsz" 100;
  letter-spacing:.005em; text-wrap:balance;
}
.onboard .ob-sub{ color:var(--ink-soft); margin-top:9px; font-size:15px; }
.ob-cards{
  display:grid; grid-template-columns:repeat(3,1fr); gap:13px;
  margin:30px 0 22px;
}
.ob-card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:22px 16px 19px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  box-shadow:var(--shadow-sm); text-align:center;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.ob-card:hover{
  transform:translateY(-3px); box-shadow:var(--shadow-md);
  border-color:var(--accent);
}
.ob-card .ob-icon{
  width:46px; height:46px; border-radius:14px; margin-bottom:9px;
  background:var(--accent-tint); color:var(--accent);
  display:grid; place-items:center;
}
.ob-card:nth-child(2) .ob-icon{ background:var(--gold-tint); color:var(--gold-strong); }
.ob-card .ob-icon svg{ width:22px; height:22px; }
.ob-card > div{ display:flex; flex-direction:column; gap:3px; align-items:center; }
.ob-card .ob-name{ font-weight:700; font-size:15px; }
.ob-card .ob-desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.45; }
.ob-sample{
  display:inline-flex; align-items:center; gap:9px;
  font-size:13.5px; color:var(--ink-soft); cursor:pointer; user-select:none;
}
.ob-sample input{ accent-color:var(--accent); width:16px; height:16px; }
.ob-foot{ margin-top:17px; font-size:12.5px; color:var(--ink-faint); }

/* ============================================================
   Toasts, FAB, footer
   ============================================================ */
#toasts{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  z-index:300; display:flex; flex-direction:column; gap:9px; align-items:center;
  pointer-events:none; width:min(420px, calc(100vw - 40px));
}
.toast{
  pointer-events:auto;
  background:var(--ink); color:var(--bg);
  border-radius:12px; padding:11px 17px;
  font-size:13.5px; font-weight:500;
  box-shadow:var(--shadow-lg);
  display:flex; align-items:center; gap:14px;
  animation:toast-in .3s cubic-bezier(.2,.9,.3,1.15);
  max-width:100%;
}
@keyframes toast-in{
  from{ opacity:0; transform:translateY(12px) scale(.96); }
  to{ opacity:1; transform:none; }
}
.toast.leaving{ opacity:0; transform:translateY(8px); transition:all .25s ease; }
.toast button{
  color:var(--gold); font-weight:700; font-size:13px; flex:none;
  text-transform:uppercase; letter-spacing:.04em;
}
:root[data-theme="dark"] .toast{ background:var(--surface-3); color:var(--ink); }

#fab{
  position:fixed; right:20px; bottom:20px; z-index:50;
  width:56px; height:56px; border-radius:18px;
  background:var(--accent); color:var(--on-accent);
  box-shadow:var(--shadow-lg);
  display:none; place-items:center;
  transition:transform .15s ease, background .15s ease;
}
#fab:hover{ background:var(--accent-strong); }
#fab:active{ transform:scale(.92); }
#fab svg{ width:22px; height:22px; }

.foot{
  padding-top:8px; padding-bottom:34px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  font-size:12.5px; color:var(--ink-faint);
}
.foot .spacer{ flex:1; }
.kbd-hint{ display:flex; align-items:center; gap:5px; }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 1020px){
  .day-layout{ grid-template-columns:1fr; }
  .day-side{ position:static; }
  .week-layout, .month-layout{ grid-template-columns:1fr; }
  .goal-panel, .month-goals{ position:static; }
}
@media (max-width: 860px){
  .topbar{ gap:10px; }
  .head-quote{ order:3; flex-basis:100%; justify-content:flex-start; padding:2px 0 4px; }
  .head-quote .quote-text{ white-space:normal; font-size:13px; max-width:none; text-align:left; }
  .searchwrap{ width:150px; }
  .searchwrap:focus-within{ width:180px; }
}
@media (max-width: 640px){
  .container{ padding:0 14px; }
  #newTaskBtn{ display:none; }
  #fab{ display:grid; }
  .brand-date{ display:none; }
  .searchwrap{ flex:1; width:auto; min-width:0; }
  .searchwrap:focus-within{ width:auto; }
  .head-actions{ flex:1 1 100%; order:4; }
  .week-grid{ grid-template-columns:1fr; }
  .wcol{ min-height:0; }
  .wcol:not(.today) .wcol-head .dnum{ font-size:15px; }
  .cal-cell{ min-height:64px; padding:5px 5px; }
  .cal-badge{ padding:1px 6px; font-size:9.5px; }
  .cal-cell .cnum{ font-size:12.5px; width:22px; height:22px; }
  .tl-label{ padding-left:4px; }
  .tl-row{ grid-template-columns:52px 1fr; }
  .now-line{ left:46px; }
  .modal{ padding:19px; }
  .field-row{ grid-template-columns:1fr; }
  .ob-cards{ grid-template-columns:1fr; }
  .ob-card{ flex-direction:row; text-align:left; padding:15px 17px; }
  .ob-card .ob-icon{ margin-bottom:0; margin-right:12px; flex:none; }
  .ob-card > div{ display:flex; flex-direction:column; gap:2px; align-items:flex-start; }
  .goals-grid{ grid-template-columns:1fr; }
  .foot{ justify-content:center; text-align:center; }

}
</style>
