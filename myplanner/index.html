<script>
'use strict';
/* ============================================================
   MyPlanner — a personal planner for days, weeks and months.
   Everything lives in localStorage; no server, no build step.
   ============================================================ */

/* ---------- tiny DOM + date utilities ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
    else if (k === 'html') n.innerHTML = v;
    else if (v === true) n.setAttribute(k, '');
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}

const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function parseISO(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfWeek(d){ const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const todayISO = () => iso(new Date());
function diffDays(isoA, isoB){ return Math.round((parseISO(isoA) - parseISO(isoB)) / 864e5); }

const FMT_LONG  = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
const FMT_MED   = new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
const FMT_SHORT = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });
const FMT_MONTH = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' });

function fmtTime(t){
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  const ap = h < 12 ? 'AM' : 'PM';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return m ? `${hh}:${pad2(m)} ${ap}` : `${hh} ${ap}`;
}
function fmtHour(h){ const ap = h < 12 ? 'AM' : 'PM'; const hh = h % 12 === 0 ? 12 : h % 12; return `${hh} ${ap}`; }

const uid = () => (crypto.randomUUID ? crypto.randomUUID().slice(0, 12) : Math.random().toString(36).slice(2, 12)) + Date.now().toString(36);

/* ---------- icons ---------- */
const ICONS = {
  plus:    '<path d="M12 5v14M5 12h14"/>',
  chevL:   '<path d="M15 18l-6-6 6-6"/>',
  chevR:   '<path d="M9 18l6-6-6-6"/>',
  x:       '<path d="M18 6L6 18M6 6l12 12"/>',
  trash:   '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/>',
  pencil:  '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  check:   '<path d="M20 6L9 17l-5-5"/>',
  clock:   '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>',
  target:  '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.5"/>',
  link:    '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
  cal:     '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9.5h18M8 2v3M16 2v3"/>',
  sun:     '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"/>',
  moon:    '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  filter:  '<path d="M4 6h16M7 12h10M10 18h4"/>',
  flag:    '<path d="M5 21V4.5C5 4.5 7 3 9.5 3s4 1.5 6.5 1.5S20 3.5 20 3.5V14s-1.5 1.5-4 1.5S11.5 14 9 14s-4 1.5-4 1.5"/>',
  box:     '<path d="M21 8v13H3V8M1 3h22v5H1M10 12h4"/>',
  search:  '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  sparkle: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 17l.9 2.1L22 20l-2.1.9L19 23l-.9-2.1L16 20l2.1-.9z"/>'
};
function icon(name, cls){
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', '2');
  s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  s.setAttribute('aria-hidden', 'true');
  if (cls) s.setAttribute('class', cls);
  s.innerHTML = ICONS[name] || '';
  return s;
}

/* ---------- constants ---------- */
const CATS = [
  { id: 'work',     label: 'Work' },
  { id: 'personal', label: 'Personal' },
  { id: 'study',    label: 'Study' },
  { id: 'health',   label: 'Health' },
  { id: 'other',    label: 'Other' }
];
const PRIS = [
  { id: 'high',   label: 'High' },
  { id: 'medium', label: 'Medium' },
  { id: 'low',    label: 'Low' }
];
const PRI_ORDER = { high: 0, medium: 1, low: 2 };
const catLabel = id => (CATS.find(c => c.id === id) || CATS[4]).label;

const QUOTES = [
  ['How we spend our days is, of course, how we spend our lives.', 'Annie Dillard'],
  ['You do not rise to the level of your goals. You fall to the level of your systems.', 'James Clear'],
  ['A goal without a plan is just a wish.', 'Antoine de Saint-Exupéry'],
  ['Well begun is half done.', 'Aristotle'],
  ['It always seems impossible until it’s done.', 'Nelson Mandela'],
  ['Little by little, one travels far.', 'Spanish proverb'],
  ['The best way out is always through.', 'Robert Frost'],
  ['Focus on being productive instead of busy.', 'Tim Ferriss'],
  ['Either you run the day, or the day runs you.', 'Jim Rohn'],
  ['Begin anywhere.', 'John Cage'],
  ['Small deeds done are better than great deeds planned.', 'Peter Marshall'],
  ['Simplicity boils down to two steps: identify the essential, eliminate the rest.', 'Leo Babauta'],
  ['Action is the foundational key to all success.', 'Pablo Picasso'],
  ['What you do every day matters more than what you do once in a while.', 'Gretchen Rubin'],
  ['The secret of getting ahead is getting started.', 'Mark Twain'],
  ['Someday is not a day of the week.', 'Janet Dailey']
];

/* ---------- store ---------- */
const STORE_KEY = 'myplanner.v1';
const storage = {
  get(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } },
  set(v){ try { localStorage.setItem(STORE_KEY, JSON.stringify(v)); } catch (e) {} }
};

let state = Object.assign(
  { v: 1, tasks: [], goals: [], prefs: { onboarded: false, theme: null, lastView: 'day', quoteOffset: 0 } },
  storage.get() || {}
);
state.prefs = Object.assign({ onboarded: false, theme: null, lastView: 'day', quoteOffset: 0 }, state.prefs);
const save = () => storage.set(state);

/* ---------- ui state (not persisted) ---------- */
const ui = {
  view: state.prefs.lastView || 'day',
  dayDate: todayISO(),
  weekStart: iso(startOfWeek(new Date())),
  monthY: new Date().getFullYear(),
  monthM: new Date().getMonth(),
  search: '',
  fcats: new Set(),
  fpris: new Set(),
  scrollToNow: true
};

/* ---------- derived helpers ---------- */
const taskById = id => state.tasks.find(t => t.id === id);
const goalById = id => state.goals.find(g => g.id === id);
const tasksOn = dateISO => state.tasks.filter(t => t.date === dateISO);

function goalProgress(g){
  const linked = state.tasks.filter(t => t.goalId === g.id);
  if (linked.length){
    const done = linked.filter(t => t.done).length;
    return { pct: Math.round(done / linked.length * 100), linked: linked.length, done, auto: true };
  }
  return { pct: Math.max(0, Math.min(100, Math.round(g.progress || 0))), linked: 0, done: 0, auto: false };
}

function matchesFilters(t){
  if (ui.fcats.size && !ui.fcats.has(t.category)) return false;
  if (ui.fpris.size && !ui.fpris.has(t.priority)) return false;
  if (ui.search){
    const q = ui.search;
    if (!(t.title.toLowerCase().includes(q) || (t.desc || '').toLowerCase().includes(q))) return false;
  }
  return true;
}
const filtersActive = () => Boolean(ui.search || ui.fcats.size || ui.fpris.size);

function timeMinutes(t){
  if (!t.time) return Infinity;
  const [h, m] = t.time.split(':').map(Number);
  return h * 60 + m;
}
function sortTasks(a, b){
  if (a.done !== b.done) return a.done ? 1 : -1;
  const ta = timeMinutes(a), tb = timeMinutes(b);
  if (ta !== tb) return ta - tb;
  if (PRI_ORDER[a.priority] !== PRI_ORDER[b.priority]) return PRI_ORDER[a.priority] - PRI_ORDER[b.priority];
  return (a.createdAt || 0) - (b.createdAt || 0);
}

/* ---------- mutations ---------- */
function upsertTask(data, existing){
  if (existing){
    Object.assign(existing, data);
    toast('Task updated');
  } else {
    state.tasks.push(Object.assign({ id: uid(), done: false, createdAt: Date.now() }, data));
    toast('Task added');
  }
  save(); renderAll();
}

function toggleTask(id){
  const t = taskById(id);
  if (!t) return;
  const goal = t.goalId ? goalById(t.goalId) : null;
  const before = goal ? goalProgress(goal).pct : 0;
  t.done = !t.done;
  save();
  if (goal && t.done){
    const after = goalProgress(goal).pct;
    if (before < 100 && after >= 100) toast(`Goal reached: “${goal.title}” ✦`);
  }
  renderAll();
}

function deleteTask(id){
  const idx = state.tasks.findIndex(t => t.id === id);
  if (idx < 0) return;
  const [removed] = state.tasks.splice(idx, 1);
  save(); renderAll();
  toast(`Deleted “${truncate(removed.title, 26)}”`, {
    label: 'Undo',
    fn(){ state.tasks.splice(Math.min(idx, state.tasks.length), 0, removed); save(); renderAll(); }
  });
}

function upsertGoal(data, existing){
  if (existing){
    Object.assign(existing, data);
    toast('Goal updated');
  } else {
    state.goals.push(Object.assign({ id: uid(), progress: 0, createdAt: Date.now() }, data));
    toast('Goal added');
  }
  save(); renderAll();
}

function deleteGoal(id){
  const idx = state.goals.findIndex(g => g.id === id);
  if (idx < 0) return;
  const [removed] = state.goals.splice(idx, 1);
  const linkedIds = state.tasks.filter(t => t.goalId === id).map(t => t.id);
  state.tasks.forEach(t => { if (t.goalId === id) t.goalId = null; });
  save(); renderAll();
  toast(`Deleted goal “${truncate(removed.title, 24)}”`, {
    label: 'Undo',
    fn(){
      state.goals.splice(Math.min(idx, state.goals.length), 0, removed);
      state.tasks.forEach(t => { if (linkedIds.includes(t.id)) t.goalId = id; });
      save(); renderAll();
    }
  });
}

function adjustGoal(g, delta){
  const p = goalProgress(g);
  if (p.auto) return;
  const before = p.pct;
  g.progress = Math.max(0, Math.min(100, before + delta));
  save();
  if (before < 100 && g.progress >= 100) toast(`Goal reached: “${g.title}” ✦`);
  renderAll();
}

const truncate = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

/* ============================================================
   Header — date, quote, theme, search, filters
   ============================================================ */
function renderHeadDate(){
  $('#headDate').textContent = FMT_MED.format(new Date());
}

let quoteIdx = null;
function renderQuote(shuffle){
  const base = Math.floor(Date.now() / 864e5) + (state.prefs.quoteOffset || 0);
  if (shuffle){
    state.prefs.quoteOffset = (state.prefs.quoteOffset || 0) + 1;
    save();
  }
  const idx = (Math.floor(Date.now() / 864e5) + (state.prefs.quoteOffset || 0)) % QUOTES.length;
  if (idx === quoteIdx) return;
  quoteIdx = idx;
  const [text, author] = QUOTES[idx];
  const elq = $('#quoteText');
  elq.classList.add('fading');
  setTimeout(() => {
    elq.innerHTML = '';
    elq.append(`“${text}” `, el('span', { class: 'quote-author' }, `— ${author}`));
    elq.classList.remove('fading');
  }, shuffle ? 200 : 0);
}

function resolvedTheme(){
  const stamped = document.documentElement.getAttribute('data-theme');
  if (stamped) return stamped;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function renderThemeBtn(){
  const b = $('#themeBtn');
  b.innerHTML = '';
  b.append(icon(resolvedTheme() === 'dark' ? 'sun' : 'moon'));
}
function toggleTheme(){
  const next = resolvedTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  state.prefs.theme = next;
  save();
  renderThemeBtn();
}

/* Filter popover */
function renderFilterPanel(){
  const p = $('#filterPanel');
  p.innerHTML = '';
  p.append(
    el('h4', null, 'Category'),
    el('div', { class: 'chip-row' },
      CATS.map(c => el('button', {
        class: 'fchip' + (ui.fcats.has(c.id) ? ' on' : ''),
        onclick(){ ui.fcats.has(c.id) ? ui.fcats.delete(c.id) : ui.fcats.add(c.id); renderFilterPanel(); renderFilterBtn(); renderView(); }
      }, el('span', { class: 'dot', style: { background: `var(--cat-${c.id})` } }), c.label))
    ),
    el('h4', null, 'Priority'),
    el('div', { class: 'chip-row' },
      PRIS.map(pr => el('button', {
        class: 'fchip' + (ui.fpris.has(pr.id) ? ' on' : ''),
        onclick(){ ui.fpris.has(pr.id) ? ui.fpris.delete(pr.id) : ui.fpris.add(pr.id); renderFilterPanel(); renderFilterBtn(); renderView(); }
      }, el('span', { class: 'dot', style: { background: `var(--pri-${pr.id === 'medium' ? 'med' : pr.id})` } }), pr.label))
    ),
    el('div', { class: 'clear-row' },
      el('button', { class: 'linklike', onclick(){ clearFilters(); } }, 'Clear filters'),
      el('button', { class: 'btn btn-sm', onclick: closeFilterPanel }, 'Done')
    )
  );
}
function renderFilterBtn(){
  const n = ui.fcats.size + ui.fpris.size;
  const b = $('#filterBtn');
  b.innerHTML = '';
  b.append(icon('filter'));
  b.classList.toggle('active', n > 0);
  if (n > 0) b.append(el('span', { class: 'filter-count' }, String(n)));
}
function clearFilters(){
  ui.fcats.clear(); ui.fpris.clear(); ui.search = '';
  $('#searchInput').value = '';
  renderFilterPanel(); renderFilterBtn(); renderView();
}
function openFilterPanel(){
  renderFilterPanel();
  $('#filterPanel').classList.remove('hidden');
  $('#filterBtn').setAttribute('aria-expanded', 'true');
}
function closeFilterPanel(){
  $('#filterPanel').classList.add('hidden');
  $('#filterBtn').setAttribute('aria-expanded', 'false');
}

/* ============================================================
   Rendering — dispatch
   ============================================================ */
function renderAll(){ renderNav(); renderView(); }

function renderNav(){
  $$('#viewNav .tab').forEach(b => b.classList.toggle('active', b.dataset.view === ui.view));
}

function setView(v){
  if (ui.view !== v) ui.scrollToNow = (v === 'day');
  ui.view = v;
  state.prefs.lastView = v;
  save();
  renderAll();
  window.scrollTo({ top: 0 });
}

function renderView(){
  const root = $('#viewRoot');
  root.innerHTML = '';
  const view = { day: renderDay, week: renderWeek, month: renderMonth, goals: renderGoals }[ui.view] || renderDay;
  root.append(view());
}

/* Shared: filter status note */
function filterNote(visible, total){
  if (!filtersActive() || total === 0) return null;
  return el('div', { class: 'filter-note' },
    `Showing ${visible} of ${total} task${total === 1 ? '' : 's'}`,
    el('button', { onclick: clearFilters }, 'Clear')
  );
}

function navBtn(dir, fn, label){
  return el('button', { class: 'iconbtn', onclick: fn, 'aria-label': label }, icon(dir));
}

function emptyState({ slim, iconName, title, sub, cta, onCta }){
  return el('div', { class: 'empty' + (slim ? ' slim' : '') },
    el('span', { class: 'art' }, icon(iconName || 'sparkle')),
    el('span', { class: 'e-title' }, title),
    sub ? el('span', { class: 'e-sub' }, sub) : null,
    cta ? el('button', { class: 'btn btn-primary btn-sm', onclick: onCta }, icon('plus'), cta) : null
  );
}

/* ============================================================
   Task card
   ============================================================ */
/* dataTransfer.getData is unreadable until drop in some engines,
   and empty in others — keep the dragged id here as the source of truth */
let dragTaskId = null;

function checkboxEl(t, small){
  return el('button', {
    class: 'checkbox' + (t.done ? ' checked' : ''),
    'aria-label': t.done ? 'Mark as not done' : 'Mark as done',
    onclick(e){ e.stopPropagation(); toggleTask(t.id); }
  }, icon('check'));
}

function taskCard(t, opts){
  const o = opts || {};
  const goal = t.goalId ? goalById(t.goalId) : null;
  const card = el('div', {
    class: `task pri-${t.priority}` + (t.done ? ' done' : ''),
    tabindex: '0',
    role: 'button',
    'aria-label': `Edit task: ${t.title}`,
    onclick(){ openTaskModal(t); },
    onkeydown(e){ if (e.key === 'Enter' && e.target === card){ e.preventDefault(); openTaskModal(t); } }
  },
    checkboxEl(t),
    el('div', { class: 'task-main' },
      el('div', { class: 'task-title' }, t.title),
      t.desc ? el('div', { class: 'task-desc' }, t.desc) : null,
      el('div', { class: 'task-meta' },
        t.time ? el('span', { class: 'chip chip-time' }, icon('clock'), fmtTime(t.time)) : null,
        o.showDate ? el('span', { class: 'chip chip-date' }, FMT_SHORT.format(parseISO(t.date))) : null,
        el('span', { class: `chip cat-${t.category}` }, catLabel(t.category)),
        el('span', { class: `chip pri-chip-${t.priority}` }, PRIS.find(p => p.id === t.priority).label),
        goal ? el('span', { class: 'chip chip-goal', title: `Linked to goal: ${goal.title}` }, icon('target'), truncate(goal.title, 18)) : null
      )
    ),
    el('button', {
      class: 'task-edit', 'aria-label': 'Edit task', tabindex: '-1',
      onclick(e){ e.stopPropagation(); openTaskModal(t); }
    }, icon('pencil'))
  );
  if (o.draggable){
    card.draggable = true;
    card.addEventListener('dragstart', e => {
      dragTaskId = t.id;
      e.dataTransfer.setData('text/plain', t.id);
      e.dataTransfer.effectAllowed = 'move';
      requestAnimationFrame(() => card.classList.add('dragging'));
    });
    card.addEventListener('dragend', () => { dragTaskId = null; card.classList.remove('dragging'); });
  }
  return card;
}

/* ============================================================
   Day view
   ============================================================ */
const HOUR_START = 6, HOUR_END = 23;

function renderDay(){
  const dateISO = ui.dayDate;
  const d = parseISO(dateISO);
  const isToday = dateISO === todayISO();
  const all = tasksOn(dateISO).slice();
  const visible = all.filter(matchesFilters);
  const doneCount = all.filter(t => t.done).length;
  const pct = all.length ? Math.round(doneCount / all.length * 100) : 0;

  const rel = diffDays(dateISO, todayISO());
  const relName = rel === 0 ? 'Today' : rel === 1 ? 'Tomorrow' : rel === -1 ? 'Yesterday' : FMT_LONG.format(d).split(',')[0];

  const anytime = visible.filter(t => !t.time).sort(sortTasks);

  /* progress card */
  let msg;
  if (!all.length) msg = 'A blank page. Plan something, or enjoy the calm.';
  else if (doneCount === all.length) msg = 'Everything done. Beautifully played.';
  else if (pct >= 60) msg = 'Almost there — keep the streak going.';
  else if (pct > 0) msg = 'Good start. One task at a time.';
  else msg = 'Ready when you are.';

  const progressCard = el('div', { class: 'card progress-card' + (all.length && doneCount === all.length ? ' all-done' : '') },
    el('div', { class: 'pc-top' },
      el('div', null,
        el('div', { class: 'pc-label' }, isToday ? 'Today’s progress' : 'Progress'),
        el('div', { class: 'pc-num' }, String(doneCount), el('span', { class: 'of' }, ` of ${all.length} done`))
      ),
      el('div', { class: 'pc-num', style: { fontSize: '20px', color: 'var(--ink-soft)' } }, `${pct}%`)
    ),
    el('div', { class: 'bar', role: 'progressbar', 'aria-valuenow': String(pct), 'aria-valuemin': '0', 'aria-valuemax': '100' },
      el('div', { class: 'bar-fill', style: { width: pct + '%' } })
    ),
    el('p', { class: 'pc-msg' }, msg)
  );

  /* anytime section */
  const anytimeSection = el('div', null,
    el('h3', { class: 'section-label' },
      'Anytime ' + (isToday ? 'today' : 'this day'),
      el('span', { class: 'count' }, String(anytime.length)),
      el('span', { class: 'grow' }),
      el('button', { class: 'addbtn', 'aria-label': 'Add anytime task', onclick(){ openTaskModal(null, { date: dateISO, time: '' }); } }, icon('plus'))
    ),
    anytime.length
      ? el('div', { class: 'anytime-list' }, anytime.map(t => taskCard(t)))
      : emptyState({
          slim: true, iconName: 'sparkle',
          title: all.length ? 'Nothing unscheduled' : 'Nothing here yet',
          sub: all.length ? 'Every task has its hour.' : 'Add flexible tasks that can happen any time of day.'
        })
  );

  /* timeline */
  const now = new Date();
  const timeline = el('div', { class: 'card timeline' });
  for (let h = HOUR_START; h <= HOUR_END; h++){
    const inHour = visible.filter(t => {
      if (!t.time) return false;
      const hh = Math.min(HOUR_END, Math.max(HOUR_START, Number(t.time.split(':')[0])));
      return hh === h;
    }).sort(sortTasks);

    const isNowHour = isToday && now.getHours() === h;
    const row = el('div', { class: 'tl-row' + (isNowHour ? ' now-hour' : '') },
      el('div', { class: 'tl-label' }, fmtHour(h)),
      el('div', { class: 'tl-body' },
        inHour.length
          ? inHour.map(t => taskCard(t))
          : el('button', {
              class: 'tl-add', tabindex: '-1', 'aria-label': `Add task at ${fmtHour(h)}`,
              onclick(){ openTaskModal(null, { date: dateISO, time: `${pad2(h)}:00` }); }
            }, icon('plus'), `Add at ${fmtHour(h)}`)
      )
    );
    row.style.position = 'relative';
    if (isNowHour){
      const line = el('div', { class: 'now-line' });
      line.style.top = `${(now.getMinutes() / 60 * 100).toFixed(1)}%`;
      row.append(line);
    }
    timeline.append(row);
  }

  const wrap = el('section', { class: 'view' },
    el('div', { class: 'view-head' },
      el('div', null,
        el('h2', { class: 'view-title' }, relName, ' ', el('span', { class: 'muted' }, FMT_SHORT.format(d))),
        el('div', { class: 'view-sub' }, FMT_MED.format(d))
      ),
      el('span', { class: 'spacer' }),
      el('div', { class: 'navgroup' },
        navBtn('chevL', () => { ui.dayDate = iso(addDays(d, -1)); ui.scrollToNow = false; renderView(); }, 'Previous day'),
        !isToday ? el('button', { class: 'btn btn-sm', onclick(){ ui.dayDate = todayISO(); ui.scrollToNow = true; renderView(); } }, 'Today') : null,
        navBtn('chevR', () => { ui.dayDate = iso(addDays(d, 1)); ui.scrollToNow = false; renderView(); }, 'Next day')
      )
    ),
    filterNote(visible.length, all.length),
    (filtersActive() && all.length > 0 && visible.length === 0)
      ? emptyState({ slim: true, iconName: 'search', title: 'No tasks match', sub: 'Try a different search or clear the filters.' })
      : null,
    el('div', { class: 'day-layout' },
      el('div', { class: 'day-side' }, progressCard, anytimeSection),
      el('div', null,
        el('h3', { class: 'section-label' }, 'Schedule', el('span', { class: 'count' }, String(visible.length - anytime.length))),
        timeline
      )
    )
  );

  if (isToday && ui.scrollToNow){
    ui.scrollToNow = false;
    requestAnimationFrame(() => {
      const target = wrap.querySelector('.tl-row.now-hour');
      if (target && now.getHours() > 8) target.scrollIntoView({ block: 'center' });
    });
  }
  return wrap;
}

/* keep the "now" line honest */
setInterval(() => {
  if (ui.view !== 'day' || ui.dayDate !== todayISO()) return;
  const line = $('.now-line');
  const now = new Date();
  if (!line){ renderView(); return; }
  const row = line.closest('.tl-row');
  const label = row && row.querySelector('.tl-label');
  if (label && label.textContent !== fmtHour(now.getHours())){ renderView(); return; }
  line.style.top = `${(now.getMinutes() / 60 * 100).toFixed(1)}%`;
}, 60000);

/* ============================================================
   Week view
   ============================================================ */
function goalMini(g){
  const p = goalProgress(g);
  return el('div', { class: 'goal-mini' },
    el('div', { class: 'gm-top' },
      el('span', { class: 'gm-title', onclick(){ openGoalModal(g); }, title: g.title }, g.title),
      el('span', { class: 'gm-pct' }, `${p.pct}%`)
    ),
    el('div', { class: 'bar' }, el('div', { class: 'bar-fill gold', style: { width: p.pct + '%' } }))
  );
}

function goalPanel(type, extraClass){
  const goals = state.goals.filter(g => g.type === type).sort((a, b) => goalProgress(a).pct - goalProgress(b).pct);
  const label = type === 'weekly' ? 'Weekly goals' : 'Monthly goals';
  return el('aside', { class: 'card ' + extraClass },
    el('h3', { class: 'section-label', style: { margin: '0' } },
      icon('flag'), label,
      el('span', { class: 'grow' }),
      el('button', { class: 'addbtn', 'aria-label': `Add ${type} goal`, onclick(){ openGoalModal(null, type); } }, icon('plus'))
    ),
    goals.length
      ? el('div', { class: 'gp-list' }, goals.map(goalMini))
      : el('p', { class: 'gp-empty' }, type === 'weekly'
          ? 'No weekly goals yet. Set one or two things this week should add up to.'
          : 'No monthly goals yet. What would make this month count?'),
    el('div', { style: { marginTop: '14px' } },
      el('button', { class: 'linklike', style: { fontSize: '12.5px' }, onclick(){ setView('goals'); } }, 'All goals →')
    )
  );
}

function renderWeek(){
  const start = parseISO(ui.weekStart);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const end = days[6];
  const tISO = todayISO();

  const weekISO = days.map(iso);
  const all = state.tasks.filter(t => weekISO.includes(t.date));
  const visibleCount = all.filter(matchesFilters).length;

  const sameMonth = start.getMonth() === end.getMonth();
  const rangeLabel = sameMonth
    ? `${FMT_SHORT.format(start)} – ${end.getDate()}`
    : `${FMT_SHORT.format(start)} – ${FMT_SHORT.format(end)}`;

  const isThisWeek = ui.weekStart === iso(startOfWeek(new Date()));

  const grid = el('div', { class: 'week-grid' });
  for (const d of days){
    const dISO = iso(d);
    const dayTasks = tasksOn(dISO).filter(matchesFilters).sort(sortTasks);
    const isToday = dISO === tISO;
    const col = el('div', { class: 'wcol' + (isToday ? ' today' : ''), dataset: { date: dISO } },
      el('div', { class: 'wcol-head' },
        el('span', { class: 'dname' }, d.toLocaleDateString('en-US', { weekday: 'short' })),
        el('span', { class: 'dnum' }, String(d.getDate())),
        isToday ? el('span', { class: 'today-pill' }, 'Today') : null,
        dayTasks.length ? el('span', { class: 'wcount' }, `${dayTasks.filter(t => t.done).length}/${dayTasks.length}`) : null
      ),
      dayTasks.map(t => taskCard(t, { draggable: true })),
      el('button', { class: 'wcol-add', onclick(){ openTaskModal(null, { date: dISO }); } }, icon('plus'), 'Add')
    );

    /* drag & drop */
    let dragDepth = 0;
    col.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; col.classList.add('drop-target'); });
    col.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    col.addEventListener('dragleave', () => { if (--dragDepth <= 0){ dragDepth = 0; col.classList.remove('drop-target'); } });
    col.addEventListener('drop', e => {
      e.preventDefault();
      dragDepth = 0; col.classList.remove('drop-target');
      const id = dragTaskId || e.dataTransfer.getData('text/plain');
      dragTaskId = null;
      const t = taskById(id);
      if (t && t.date !== dISO){
        t.date = dISO;
        save(); renderView();
        toast(`Moved to ${FMT_LONG.format(d)}`);
      }
    });
    grid.append(col);
  }

  return el('section', { class: 'view' },
    el('div', { class: 'view-head' },
      el('div', null,
        el('h2', { class: 'view-title' }, isThisWeek ? 'This week' : 'Week', ' ', el('span', { class: 'muted' }, rangeLabel)),
        el('div', { class: 'view-sub' }, 'Drag tasks between days to reschedule.')
      ),
      el('span', { class: 'spacer' }),
      el('div', { class: 'navgroup' },
        navBtn('chevL', () => { ui.weekStart = iso(addDays(start, -7)); renderView(); }, 'Previous week'),
        !isThisWeek ? el('button', { class: 'btn btn-sm', onclick(){ ui.weekStart = iso(startOfWeek(new Date())); renderView(); } }, 'This week') : null,
        navBtn('chevR', () => { ui.weekStart = iso(addDays(start, 7)); renderView(); }, 'Next week')
      )
    ),
    filterNote(visibleCount, all.length),
    all.length === 0 && !filtersActive()
      ? emptyState({
          iconName: 'cal', title: 'An open week',
          sub: 'Nothing scheduled between ' + rangeLabel + '. Sketch the week before it sketches you.',
          cta: 'Plan the week', onCta(){ openTaskModal(null, { date: isThisWeek ? tISO : ui.weekStart }); }
        })
      : null,
    el('div', { class: 'week-layout' }, grid, goalPanel('weekly', 'goal-panel'))
  );
}

/* ============================================================
   Month view
   ============================================================ */
function renderMonth(){
  const y = ui.monthY, m = ui.monthM;
  const first = new Date(y, m, 1);
  const gridStart = startOfWeek(first);
  const tISO = todayISO();
  const nowMonth = new Date().getFullYear() === y && new Date().getMonth() === m;

  const monthTasks = state.tasks.filter(t => { const d = parseISO(t.date); return d.getFullYear() === y && d.getMonth() === m; });
  const visibleCount = monthTasks.filter(matchesFilters).length;

  const dow = el('div', { class: 'cal-dow' }, ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => el('span', null, d)));
  const grid = el('div', { class: 'cal-grid' });

  for (let i = 0; i < 42; i++){
    const d = addDays(gridStart, i);
    const dISO = iso(d);
    const inMonth = d.getMonth() === m;
    const dayTasks = tasksOn(dISO).filter(matchesFilters);
    const doneAll = dayTasks.length > 0 && dayTasks.every(t => t.done);
    const cats = [...new Set(dayTasks.map(t => t.category))].slice(0, 4);

    grid.append(el('button', {
      class: 'cal-cell' + (inMonth ? '' : ' other') + (dISO === tISO ? ' today' : ''),
      'aria-label': `Open ${FMT_MED.format(d)}${dayTasks.length ? `, ${dayTasks.length} tasks` : ''}`,
      onclick(){ ui.dayDate = dISO; ui.scrollToNow = dISO === tISO; setView('day'); }
    },
      el('span', { class: 'cnum' }, String(d.getDate())),
      dayTasks.length
        ? el('span', { class: 'cal-badge' + (doneAll ? ' done-all' : '') },
            doneAll ? icon('check') : null,
            `${dayTasks.length}`)
        : null,
      cats.length ? el('span', { class: 'cal-dots' }, cats.map(c => el('i', { style: { background: `var(--cat-${c})` } }))) : null
    ));
  }

  return el('section', { class: 'view' },
    el('div', { class: 'view-head' },
      el('div', null,
        el('h2', { class: 'view-title' }, FMT_MONTH.format(first)),
        el('div', { class: 'view-sub' }, 'Click any date to open its day plan.')
      ),
      el('span', { class: 'spacer' }),
      el('div', { class: 'navgroup' },
        navBtn('chevL', () => { const p = new Date(y, m - 1, 1); ui.monthY = p.getFullYear(); ui.monthM = p.getMonth(); renderView(); }, 'Previous month'),
        !nowMonth ? el('button', { class: 'btn btn-sm', onclick(){ const n = new Date(); ui.monthY = n.getFullYear(); ui.monthM = n.getMonth(); renderView(); } }, 'Today') : null,
        navBtn('chevR', () => { const n = new Date(y, m + 1, 1); ui.monthY = n.getFullYear(); ui.monthM = n.getMonth(); renderView(); }, 'Next month')
      )
    ),
    filterNote(visibleCount, monthTasks.length),
    el('div', { class: 'month-layout' },
      el('div', { class: 'card cal' }, dow, grid),
      goalPanel('monthly', 'month-goals')
    )
  );
}

/* ============================================================
   Goals view
   ============================================================ */
function deadlineChip(g, pct){
  if (pct >= 100) return el('span', { class: 'chip deadline-chip met' }, icon('check'), 'Completed');
  if (!g.deadline) return null;
  const days = diffDays(g.deadline, todayISO());
  const dt = FMT_SHORT.format(parseISO(g.deadline));
  if (days < 0)  return el('span', { class: 'chip deadline-chip overdue' }, icon('clock'), `${-days}d overdue`);
  if (days === 0) return el('span', { class: 'chip deadline-chip soon' }, icon('clock'), 'Due today');
  if (days <= 7)  return el('span', { class: 'chip deadline-chip soon' }, icon('clock'), `Due in ${days}d · ${dt}`);
  return el('span', { class: 'chip deadline-chip' }, icon('cal'), `Due ${dt}`);
}

function goalCard(g){
  const p = goalProgress(g);
  const linked = state.tasks.filter(t => t.goalId === g.id).sort(sortTasks);
  const shown = linked.slice(0, 4);

  return el('article', { class: 'card goal-card' + (p.pct >= 100 ? ' done' : '') },
    el('div', { class: 'gc-top' },
      el('h3', { class: 'gc-title' }, g.title),
      el('div', { class: 'gc-actions' },
        el('button', { 'aria-label': 'Edit goal', onclick(){ openGoalModal(g); } }, icon('pencil')),
        el('button', { class: 'del', 'aria-label': 'Delete goal', onclick(){ deleteGoal(g.id); } }, icon('trash'))
      )
    ),
    g.desc ? el('p', { class: 'gc-desc' }, g.desc) : null,
    el('div', { class: 'gc-progress' },
      el('div', { class: 'bar' }, el('div', { class: 'bar-fill gold', style: { width: p.pct + '%' } })),
      el('span', { class: 'gc-pct' }, `${p.pct}%`)
    ),
    el('div', { class: 'gc-meta' },
      deadlineChip(g, p.pct),
      p.auto ? el('span', { class: 'chip chip-goal' }, icon('link'), `${p.done}/${p.linked} tasks`) : null,
      !p.auto ? el('div', { class: 'gc-steppers' },
        el('button', { 'aria-label': 'Decrease progress', onclick(){ adjustGoal(g, -10); } }, '−'),
        el('button', { 'aria-label': 'Increase progress', onclick(){ adjustGoal(g, 10); } }, '+')
      ) : null
    ),
    linked.length ? el('div', { class: 'gc-tasks' },
      el('span', { class: 'gt-label' }, 'Linked tasks'),
      shown.map(t => el('button', { class: 'gt-row' + (t.done ? ' done' : ''), onclick(){ openTaskModal(t); } },
        checkboxEl(t),
        el('span', null, t.title)
      )),
      linked.length > shown.length ? el('span', { class: 'gt-label', style: { textTransform: 'none', letterSpacing: '0' } }, `+ ${linked.length - shown.length} more`) : null
    ) : null
  );
}

function goalsSection(type, label, sub){
  const goals = state.goals
    .filter(g => g.type === type)
    .sort((a, b) => {
      const pa = goalProgress(a).pct >= 100, pb = goalProgress(b).pct >= 100;
      if (pa !== pb) return pa ? 1 : -1;
      return (a.deadline || '9999').localeCompare(b.deadline || '9999');
    });
  return el('div', { class: 'goals-section' },
    el('h3', { class: 'section-label' },
      icon('flag'), label,
      el('span', { class: 'count' }, String(goals.length)),
      el('span', { class: 'grow' }),
      el('button', { class: 'addbtn', 'aria-label': `Add ${type} goal`, onclick(){ openGoalModal(null, type); } }, icon('plus'))
    ),
    goals.length
      ? el('div', { class: 'goals-grid' }, goals.map(goalCard))
      : emptyState({
          slim: true, iconName: 'target',
          title: `No ${type} goals yet`, sub,
          cta: 'Set a goal', onCta(){ openGoalModal(null, type); }
        })
  );
}

function renderGoals(){
  return el('section', { class: 'view' },
    el('div', { class: 'view-head' },
      el('div', null,
        el('h2', { class: 'view-title' }, 'Goals'),
        el('div', { class: 'view-sub' }, 'Link tasks to a goal and progress tracks itself.')
      ),
      el('span', { class: 'spacer' }),
      el('button', { class: 'btn btn-primary', onclick(){ openGoalModal(null, 'weekly'); } }, icon('plus'), 'New goal')
    ),
    goalsSection('weekly', 'This week', 'Small, near wins — the kind a good week is made of.'),
    goalsSection('monthly', 'This month', 'Bigger arcs that your days should quietly add up to.')
  );
}

/* ============================================================
   Modals
   ============================================================ */
function openModal(node){
  const m = $('#modal');
  m.innerHTML = '';
  m.append(node);
  $('#overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  const f = m.querySelector('input[type="text"], textarea, select, input');
  if (f) setTimeout(() => f.focus(), 60);
}
function closeModal(){
  $('#overlay').classList.add('hidden');
  document.body.style.overflow = '';
}
$('#overlay').addEventListener('mousedown', e => { if (e.target === $('#overlay')) closeModal(); });

function modalHead(title){
  return el('div', { class: 'modal-head' },
    el('h2', { class: 'modal-title' }, title),
    el('button', { class: 'iconbtn ghost', 'aria-label': 'Close', onclick: closeModal }, icon('x'))
  );
}

function field(labelText, control, errText){
  return el('div', { class: 'field' },
    el('label', { class: 'flabel' }, labelText),
    control,
    errText ? el('div', { class: 'err' }, errText) : null
  );
}

/* --- Task modal --- */
function openTaskModal(task, presets){
  const p = presets || {};
  const data = {
    title: task ? task.title : (p.title || ''),
    desc: task ? (task.desc || '') : '',
    date: task ? task.date : (p.date || ui.dayDate || todayISO()),
    time: task ? (task.time || '') : (p.time || ''),
    priority: task ? task.priority : 'medium',
    category: task ? task.category : 'other',
    goalId: task ? (task.goalId || '') : (p.goalId || '')
  };

  const titleIn = el('input', { type: 'text', value: data.title, placeholder: 'What needs doing?', maxlength: '140' });
  const descIn  = el('textarea', { placeholder: 'Details, links, notes… (optional)', maxlength: '600' }); descIn.value = data.desc;
  const dateIn  = el('input', { type: 'date', value: data.date, required: true });
  const timeIn  = el('input', { type: 'time', value: data.time || '09:00', min: '06:00', max: '23:59', 'aria-label': 'Time' });

  let when = data.time ? 'timed' : 'anytime';
  const whenSeg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Time slot' });
  function renderWhen(){
    whenSeg.innerHTML = '';
    whenSeg.append(
      el('button', { type: 'button', class: when === 'anytime' ? 'on' : '', onclick(){ when = 'anytime'; renderWhen(); } }, 'Anytime'),
      el('button', { type: 'button', class: when === 'timed' ? 'on' : '', onclick(){ when = 'timed'; renderWhen(); timeIn.focus(); } }, 'At a time')
    );
    timeIn.style.display = when === 'timed' ? '' : 'none';
  }
  renderWhen();

  let pri = data.priority;
  const priSeg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Priority' });
  function renderPri(){
    priSeg.innerHTML = '';
    PRIS.forEach(pr => priSeg.append(
      el('button', {
        type: 'button', class: pri === pr.id ? 'on' : '', dataset: { pri: pr.id },
        onclick(){ pri = pr.id; renderPri(); }
      },
        el('span', { class: 'dot', style: { background: `var(--pri-${pr.id === 'medium' ? 'med' : pr.id})` } }),
        pr.label)
    ));
  }
  renderPri();

  const catSel = el('select', { 'aria-label': 'Category' });
  CATS.forEach(c => {
    const o = el('option', { value: c.id }, c.label);
    if (c.id === data.category) o.selected = true;
    catSel.append(o);
  });

  const goalSel = el('select', { 'aria-label': 'Linked goal' });
  goalSel.append(el('option', { value: '' }, 'None'));
  for (const type of ['weekly', 'monthly']){
    const goals = state.goals.filter(g => g.type === type);
    if (!goals.length) continue;
    const og = el('optgroup', { label: type === 'weekly' ? 'Weekly goals' : 'Monthly goals' });
    goals.forEach(g => {
      const o = el('option', { value: g.id }, truncate(g.title, 44));
      if (g.id === data.goalId) o.selected = true;
      og.append(o);
    });
    goalSel.append(og);
  }

  const titleField = field('Title', titleIn, 'Give the task a name.');

  function submit(){
    const title = titleIn.value.trim();
    if (!title){
      titleField.classList.add('invalid');
      titleIn.focus();
      return;
    }
    upsertTask({
      title,
      desc: descIn.value.trim(),
      date: dateIn.value || todayISO(),
      time: when === 'timed' ? (timeIn.value || '09:00') : '',
      priority: pri,
      category: catSel.value,
      goalId: goalSel.value || null
    }, task);
    closeModal();
  }
  titleIn.addEventListener('input', () => titleField.classList.remove('invalid'));

  const form = el('form', { onsubmit(e){ e.preventDefault(); submit(); } },
    modalHead(task ? 'Edit task' : 'New task'),
    titleField,
    field('Description', descIn),
    el('div', { class: 'field-row' },
      field('Date', dateIn),
      field('Time slot', el('div', { class: 'when-row' }, whenSeg, timeIn))
    ),
    field('Priority', priSeg),
    el('div', { class: 'field-row' },
      field('Category', catSel),
      field('Link to goal', goalSel)
    ),
    el('div', { class: 'modal-foot' },
      task ? el('button', { type: 'button', class: 'btn btn-danger btn-sm', onclick(){ closeModal(); deleteTask(task.id); } }, icon('trash'), 'Delete') : null,
      el('span', { class: 'spacer' }),
      el('button', { type: 'button', class: 'btn', onclick: closeModal }, 'Cancel'),
      el('button', { type: 'submit', class: 'btn btn-primary' }, task ? 'Save changes' : 'Add task')
    )
  );
  openModal(form);
}

/* --- Goal modal --- */
function openGoalModal(goal, presetType){
  const data = {
    title: goal ? goal.title : '',
    desc: goal ? (goal.desc || '') : '',
    type: goal ? goal.type : (presetType || 'weekly'),
    deadline: goal ? (goal.deadline || '') : '',
    progress: goal ? (goal.progress || 0) : 0
  };
  const p = goal ? goalProgress(goal) : { auto: false, linked: 0, done: 0 };

  const titleIn = el('input', { type: 'text', value: data.title, placeholder: 'e.g. Run 20 km this week', maxlength: '120' });
  const descIn  = el('textarea', { placeholder: 'Why it matters, or how you’ll get there (optional)', maxlength: '500' }); descIn.value = data.desc;
  const deadIn  = el('input', { type: 'date', value: data.deadline });

  let type = data.type;
  const typeSeg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Goal horizon' });
  function renderType(){
    typeSeg.innerHTML = '';
    typeSeg.append(
      el('button', { type: 'button', class: type === 'weekly' ? 'on' : '', onclick(){ type = 'weekly'; renderType(); } }, 'Weekly'),
      el('button', { type: 'button', class: type === 'monthly' ? 'on' : '', onclick(){ type = 'monthly'; renderType(); } }, 'Monthly')
    );
  }
  renderType();

  const rangeOut = el('output', null, `${data.progress}%`);
  const rangeIn = el('input', { type: 'range', min: '0', max: '100', step: '5', value: String(data.progress),
    oninput(){ rangeOut.textContent = `${rangeIn.value}%`; } });

  const progressField = p.auto
    ? el('div', { class: 'auto-note' },
        'Progress is tracked automatically from its ', el('b', null, `${p.linked} linked task${p.linked === 1 ? '' : 's'}`),
        ` — ${p.done} done so far. Unlink the tasks to set progress by hand.`)
    : el('div', { class: 'range-wrap' }, rangeIn, rangeOut);

  const titleField = field('Title', titleIn, 'Give the goal a name.');

  function submit(){
    const title = titleIn.value.trim();
    if (!title){ titleField.classList.add('invalid'); titleIn.focus(); return; }
    upsertGoal({
      title,
      desc: descIn.value.trim(),
      type,
      deadline: deadIn.value || '',
      progress: p.auto ? (goal ? goal.progress : 0) : Number(rangeIn.value)
    }, goal);
    closeModal();
  }
  titleIn.addEventListener('input', () => titleField.classList.remove('invalid'));

  const form = el('form', { onsubmit(e){ e.preventDefault(); submit(); } },
    modalHead(goal ? 'Edit goal' : 'New goal'),
    titleField,
    field('Description', descIn),
    el('div', { class: 'field-row' },
      field('Horizon', typeSeg),
      field('Deadline', deadIn)
    ),
    field('Progress', progressField),
    el('div', { class: 'modal-foot' },
      goal ? el('button', { type: 'button', class: 'btn btn-danger btn-sm', onclick(){ closeModal(); deleteGoal(goal.id); } }, icon('trash'), 'Delete') : null,
      el('span', { class: 'spacer' }),
      el('button', { type: 'button', class: 'btn', onclick: closeModal }, 'Cancel'),
      el('button', { type: 'submit', class: 'btn btn-primary' }, goal ? 'Save changes' : 'Add goal')
    )
  );
  openModal(form);
}

/* --- Backup modal --- */
function openBackupModal(){
  const exportArea = el('textarea', { class: 'backup-area', readonly: true, 'aria-label': 'Your data as JSON' });
  exportArea.value = JSON.stringify({ v: state.v, tasks: state.tasks, goals: state.goals, prefs: state.prefs });
  exportArea.addEventListener('focus', () => exportArea.select());

  const importArea = el('textarea', { class: 'backup-area', placeholder: 'Paste a MyPlanner backup here…', 'aria-label': 'Backup JSON to restore' });

  const node = el('div', null,
    modalHead('Backup & restore'),
    el('p', { class: 'backup-note' }, 'Copy this anywhere safe — a note, a file, an email to yourself. Paste it back on any device to restore.'),
    field('Your data', exportArea),
    el('div', { style: { display: 'flex', justifyContent: 'flex-end', marginTop: '-6px', marginBottom: '14px' } },
      el('button', { class: 'btn btn-sm', async onclick(e){
        try{
          await navigator.clipboard.writeText(exportArea.value);
          e.currentTarget.textContent = 'Copied ✓';
        }catch(err){ exportArea.focus(); }
      } }, 'Copy to clipboard')
    ),
    field('Restore from backup', importArea),
    el('p', { class: 'backup-note' }, 'Restoring replaces everything currently in this browser.'),
    el('div', { class: 'modal-foot' },
      el('span', { class: 'spacer' }),
      el('button', { class: 'btn', onclick: closeModal }, 'Close'),
      el('button', { class: 'btn btn-primary', onclick(){
        try{
          const parsed = JSON.parse(importArea.value);
          if (!parsed || !Array.isArray(parsed.tasks) || !Array.isArray(parsed.goals)) throw new Error('bad shape');
          state.tasks = parsed.tasks;
          state.goals = parsed.goals;
          if (parsed.prefs) state.prefs = Object.assign(state.prefs, parsed.prefs, { onboarded: true });
          save(); closeModal(); renderAll();
          toast('Backup restored');
        }catch(err){
          toast('That doesn’t look like a MyPlanner backup');
        }
      } }, 'Restore')
    )
  );
  openModal(node);
}

/* ============================================================
   Toasts
   ============================================================ */
function toast(msg, action){
  const host = $('#toasts');
  while (host.children.length >= 3) host.firstChild.remove();
  const t = el('div', { class: 'toast' },
    el('span', null, msg),
    action ? el('button', { onclick(){ action.fn(); dismiss(); } }, action.label) : null
  );
  let gone = false;
  function dismiss(){
    if (gone) return; gone = true;
    t.classList.add('leaving');
    setTimeout(() => t.remove(), 260);
  }
  host.append(t);
  setTimeout(dismiss, action ? 6000 : 3200);
}

/* ============================================================
   Onboarding + sample data
   ============================================================ */
function seedSamples(){
  const t = new Date();
  const day = n => iso(addDays(t, n));
  const wk = iso(addDays(startOfWeek(t), 6));
  const endOfMonth = iso(new Date(t.getFullYear(), t.getMonth() + 1, 0));

  const gRun   = { id: uid(), type: 'weekly',  title: 'Move every day', desc: 'A run, a ride, or a long walk — anything counts.', deadline: wk, progress: 0, createdAt: Date.now() };
  const gInbox = { id: uid(), type: 'weekly',  title: 'Inbox zero by Friday', desc: '', deadline: wk, progress: 40, createdAt: Date.now() };
  const gShip  = { id: uid(), type: 'monthly', title: 'Ship the side project', desc: 'Get v1 out of the door — imperfect but live.', deadline: endOfMonth, progress: 0, createdAt: Date.now() };
  const gRead  = { id: uid(), type: 'monthly', title: 'Finish two books', desc: '', deadline: endOfMonth, progress: 50, createdAt: Date.now() };
  state.goals.push(gRun, gInbox, gShip, gRead);

  const mk = (o) => Object.assign({ id: uid(), desc: '', time: '', done: false, goalId: null, createdAt: Date.now() }, o);
  state.tasks.push(
    mk({ title: 'Morning run', desc: '5k along the river loop.', date: day(0), time: '07:30', priority: 'medium', category: 'health', goalId: gRun.id, done: true }),
    mk({ title: 'Deep work: project proposal', desc: 'Draft the outline and the first two sections.', date: day(0), time: '09:00', priority: 'high', category: 'work', goalId: gShip.id }),
    mk({ title: 'Lunch with Sam', date: day(0), time: '13:00', priority: 'low', category: 'personal' }),
    mk({ title: 'Review pull requests', date: day(0), time: '16:00', priority: 'medium', category: 'work' }),
    mk({ title: 'Read 20 pages', desc: 'Currently: “Four Thousand Weeks”.', date: day(0), priority: 'medium', category: 'study', goalId: gRead.id }),
    mk({ title: 'Plan tomorrow', date: day(0), priority: 'low', category: 'other', done: true }),
    mk({ title: 'Team standup notes', date: day(1), time: '09:30', priority: 'medium', category: 'work' }),
    mk({ title: 'Evening yoga', date: day(1), time: '18:30', priority: 'low', category: 'health', goalId: gRun.id }),
    mk({ title: 'Grocery run', desc: 'Veg, coffee, oats.', date: day(2), priority: 'low', category: 'personal' }),
    mk({ title: 'Publish landing page', desc: 'Copy pass, then deploy.', date: day(3), time: '10:00', priority: 'high', category: 'work', goalId: gShip.id }),
    mk({ title: 'Call the bank', date: day(4), time: '11:00', priority: 'high', category: 'other' }),
    mk({ title: 'Long ride', date: day(5), time: '08:00', priority: 'medium', category: 'health', goalId: gRun.id })
  );
}

function initOnboarding(){
  const ob = $('#onboard');
  ob.classList.remove('hidden');
  $$('.ob-card', ob).forEach(btn => {
    btn.addEventListener('click', () => {
      if ($('#obSample').checked) seedSamples();
      state.prefs.onboarded = true;
      state.prefs.lastView = btn.dataset.view;
      save();
      ob.classList.add('hidden');
      ui.view = btn.dataset.view;
      ui.scrollToNow = true;
      renderAll();
    });
  });
}

/* ============================================================
   Global events + init
   ============================================================ */
$('#viewNav').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b) setView(b.dataset.view);
});
$('#newTaskBtn').addEventListener('click', () => openTaskModal(null, { date: ui.view === 'day' ? ui.dayDate : todayISO() }));
$('#fab').addEventListener('click', () => openTaskModal(null, { date: ui.view === 'day' ? ui.dayDate : todayISO() }));
$('#themeBtn').addEventListener('click', toggleTheme);
$('#quoteNext').addEventListener('click', () => renderQuote(true));
$('#backupBtn').addEventListener('click', openBackupModal);

$('#filterBtn').addEventListener('click', e => {
  e.stopPropagation();
  $('#filterPanel').classList.contains('hidden') ? openFilterPanel() : closeFilterPanel();
});
document.addEventListener('click', e => {
  if (!$('#filterPanel').classList.contains('hidden') && !e.target.closest('.filterwrap')) closeFilterPanel();
});

let searchTimer = null;
$('#searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    ui.search = e.target.value.trim().toLowerCase();
    renderView();
  }, 140);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if (!$('#overlay').classList.contains('hidden')) closeModal();
    else closeFilterPanel();
    return;
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (!$('#overlay').classList.contains('hidden') || !$('#onboard').classList.contains('hidden')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); openTaskModal(null, { date: ui.view === 'day' ? ui.dayDate : todayISO() }); }
  else if (e.key === '1') setView('day');
  else if (e.key === '2') setView('week');
  else if (e.key === '3') setView('month');
  else if (e.key === '4') setView('goals');
  else if (e.key === '/'){ e.preventDefault(); $('#searchInput').focus(); }
});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderThemeBtn);

/* refresh header date + day view if the app is left open across midnight */
setInterval(() => {
  const shown = $('#headDate').textContent;
  if (shown && shown !== FMT_MED.format(new Date())){
    renderHeadDate(); renderQuote(false); renderView();
  }
}, 60000);

/* boot */
$('#quoteNext').append(icon('refresh'));
renderHeadDate();
renderQuote(false);
renderThemeBtn();
renderFilterBtn();
if (!state.prefs.onboarded) initOnboarding();
renderAll();
</script>
